<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#81D8D0">
<title>Salon Admin</title>

<style>
:root{
  --tiffany:#81D8D0;
  --deep:#58bdb4;
  --gold:#b9975b;
  --off:#fbf8f0;
  --ink:#2c2926;
  --muted:#777069;
  --line:#e6ded2;
  --soft:#eef9f8;
  --danger:#9b4c4c;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:linear-gradient(180deg,#f7ffff,var(--off));
  color:var(--ink);
}

.wrap{
  max-width:920px;
  margin:auto;
  padding:18px 12px 60px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.top button{
  width:auto;
  margin:0;
}

.eyebrow{
  font-size:11px;
  letter-spacing:.18em;
  color:var(--gold);
  font-weight:700;
}

h1{
  font-family:Georgia,serif;
  font-weight:500;
  margin:5px 0;
}

h2{
  font-size:18px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 8px 24px rgba(40,30,20,.05);
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.tabs button{
  margin:0;
  font-size:12px;
}

.hidden{
  display:none!important;
}

button{
  width:100%;
  border:0;
  border-radius:999px;
  padding:12px 14px;
  font-weight:800;
  background:linear-gradient(135deg,var(--tiffany),var(--deep));
  color:#fff;
  margin-top:12px;
}

button.ghost{
  background:#fff;
  color:var(--ink);
  border:1px solid var(--line);
}

button.gold{
  background:linear-gradient(135deg,var(--gold),#a98547);
}

button.danger{
  background:#fff;
  color:var(--danger);
  border:1px solid #e2c3c3;
}

label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin:12px 0 5px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #d9d0c5;
  border-radius:12px;
  background:#fff;
  font-size:16px;
}

textarea{
  min-height:76px;
}

.note{
  font-size:12px;
  color:var(--muted);
  line-height:1.7;
}

.error,
.ok{
  font-size:13px;
  padding:10px;
  border-radius:12px;
  margin-top:10px;
}

.error{
  background:#fff3f3;
  color:#8a3d3d;
}

.ok{
  background:#f1f8f7;
  color:#3f6d68;
}

.calhead{
  display:grid;
  grid-template-columns:42px 1fr 42px;
  gap:8px;
  align-items:center;
}

.calhead button{
  margin:0;
}

.month{
  text-align:center;
  font-family:Georgia,serif;
  font-size:20px;
}

.week,
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}

.week div{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  padding:6px;
}

.day{
  min-height:74px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  padding:6px;
  cursor:pointer;
}

.day.other{
  opacity:.25;
}

.day.today{
  border-color:var(--deep);
  box-shadow:0 0 0 1px var(--deep) inset;
}

.day.selected{
  background:#eaf9f7;
}

.num{
  font-size:12px;
  font-weight:700;
}

.count{
  display:inline-block;
  margin-top:7px;
  padding:3px 5px;
  border-radius:999px;
  background:var(--soft);
  font-size:10px;
}

.booking,
.block{
  border-top:1px solid var(--line);
  padding:12px 0;
}

.booking:first-child,
.block:first-child{
  border-top:0;
}

.cancelled{
  opacity:.45;
}

.tag{
  display:inline-block;
  font-size:10px;
  background:var(--soft);
  padding:4px 7px;
  border-radius:999px;
  margin:2px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.actions button{
  margin-top:7px;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:10;
}

.box{
  background:#fff;
  width:100%;
  max-width:920px;
  max-height:92vh;
  overflow:auto;
  border-radius:24px 24px 0 0;
  padding:18px;
}

.close{
  float:right;
  width:auto;
  margin:0;
  background:#eee;
  color:#333;
}

@media(max-width:560px){
  .day{
    min-height:60px;
    padding:4px;
  }

  .count{
    font-size:9px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="top">

  <div>

    <div class="eyebrow">
      SALON STAFF ONLY
    </div>

    <h1>
      予約管理
    </h1>

  </div>

  <button
    id="logoutBtn"
    class="ghost hidden"
    onclick="logout()"
  >
    ログアウト
  </button>

</div>


<section
  id="login"
  class="card"
>

<h2>
  スタッフログイン
</h2>

<label>
  管理パスワード
</label>

<input
  id="password"
  type="password"
  autocomplete="current-password"
>

<div id="loginMsg"></div>

<button onclick="login()">
  ログイン
</button>

</section>


<div
  id="app"
  class="hidden"
>

<div class="tabs">

  <button onclick="showTab('res')">
    予約カレンダー
  </button>

  <button onclick="showTab('blocks')">
    休み設定
  </button>

  <button onclick="showTab('settings')">
    設定
  </button>

</div>


<section
  id="res"
  class="card"
>

<div class="calhead">

<button
  class="ghost"
  onclick="moveMonth(-1)"
>
  ‹
</button>

<div
  id="monthLabel"
  class="month"
></div>

<button
  class="ghost"
  onclick="moveMonth(1)"
>
  ›
</button>

</div>


<div class="week">

<div>日</div>
<div>月</div>
<div>火</div>
<div>水</div>
<div>木</div>
<div>金</div>
<div>土</div>

</div>


<div
  id="calendar"
  class="calendar"
></div>


<p class="note">
予約開始時刻から2時間を確保します。
同時間帯はサロン全体で最大2名までです。
</p>


<h2 id="dayTitle">
予約一覧
</h2>

<div id="bookingList"></div>

</section>


<section
  id="blocks"
  class="card hidden"
>

<h2>
予約不可・お休み設定
</h2>


<label>
日付
</label>

<input
  id="blockDate"
  type="date"
>


<label>
対象
</label>

<select id="blockStaff"></select>


<label>
設定
</label>

<select
  id="blockType"
  onchange="toggleSlot()"
>

<option value="slot">
1時間だけ予約不可
</option>

<option value="day">
1日お休み
</option>

</select>


<div id="slotWrap">

<label>
時間
</label>

<select id="blockSlot">

<option value="10:00:00|11:00:00">
10時〜11時
</option>

<option value="11:00:00|12:00:00">
11時〜12時
</option>

<option value="12:00:00|13:00:00">
12時〜13時
</option>

<option value="13:00:00|14:00:00">
13時〜14時
</option>

<option value="14:00:00|15:00:00">
14時〜15時
</option>

<option value="15:00:00|16:00:00">
15時〜16時
</option>

<option value="16:00:00|17:00:00">
16時〜17時
</option>

<option value="17:00:00|18:00:00">
17時〜18時
</option>

<option value="18:00:00|19:00:00">
18時〜19時
</option>

<option value="19:00:00|20:00:00">
19時〜20時
</option>

<option value="20:00:00|21:00:00">
20時〜21時
</option>

</select>

</div>


<label>
理由（任意）
</label>

<input
  id="blockReason"
  maxlength="120"
  placeholder="例：外出・研修・お休み"
>


<div id="blockMsg"></div>


<button
  class="gold"
  onclick="addBlock()"
>
設定する
</button>


<h2>
設定済み
</h2>

<div id="blockList"></div>

</section>


<section
  id="settings"
  class="card hidden"
>

<h2>
管理パスワード変更
</h2>

<label>
新しいパスワード（10文字以上）
</label>

<input
  id="newPassword"
  type="password"
>

<div id="passwordMsg"></div>

<button onclick="changePassword()">
変更する
</button>

</section>

</div>

</div>


<div
  id="modal"
  class="modal hidden"
>

<div class="box">

<button
  class="close"
  onclick="closeModal()"
>
閉じる
</button>


<h2>
予約を編集
</h2>


<input
  id="editId"
  type="hidden"
>


<label>
日付
</label>

<input
  id="editDate"
  type="date"
>


<label>
予約開始
</label>

<select id="editSlot">

<option value="10:00:00">
10時〜
</option>

<option value="11:00:00">
11時〜
</option>

<option value="12:00:00">
12時〜
</option>

<option value="13:00:00">
13時〜
</option>

<option value="14:00:00">
14時〜
</option>

<option value="15:00:00">
15時〜
</option>

<option value="16:00:00">
16時〜
</option>

<option value="17:00:00">
17時〜
</option>

<option value="18:00:00">
18時〜
</option>

<option value="19:00:00">
19時〜
</option>

<option value="20:00:00">
20時〜
</option>

</select>


<label>
担当
</label>

<select id="editStaff"></select>


<label>
お名前
</label>

<input id="editName">


<label>
電話
</label>

<input id="editPhone">


<label>
メール
</label>

<input id="editEmail">


<label>
メモ
</label>

<textarea id="editMemo"></textarea>


<label>
状態
</label>

<select id="editStatus">

<option value="confirmed">
予約確定
</option>

<option value="cancelled">
キャンセル
</option>

</select>


<div id="editMsg"></div>


<button
  class="gold"
  onclick="saveEdit()"
>
保存
</button>

</div>

</div>


<script>

const API =
'https://xvgrbzpnwnlqlxayvphv.supabase.co/functions/v1/salon-api';


const $ =
id =>
document.getElementById(id);


let staff = [];

let bookings = [];

let view =
new Date();

let selected =
'';


function esc(s){

return String(
  s ?? ''
)
.replace(
  /[&<>"']/g,
  m => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[m])
);

}


function fmt(t){

return String(
  t || ''
)
.slice(
  0,
  5
);

}


function ymd(d){

return (
  d.getFullYear()
  +
  '-'
  +
  String(
    d.getMonth()+1
  )
  .padStart(
    2,
    '0'
  )
  +
  '-'
  +
  String(
    d.getDate()
  )
  .padStart(
    2,
    '0'
  )
);

}


function pw(){

return (
  sessionStorage
  .getItem(
    'salonAdminPassword'
  )
  ||
  ''
);

}


async function call(
  action,
  data={}
){

const r =
await fetch(
  API,
  {
    method:'POST',

    headers:{
      'Content-Type':
      'application/json',

      'x-admin-password':
      pw()
    },

    body:
    JSON.stringify(
      {
        action,
        ...data
      }
    )
  }
);

let j = {};

try{

j =
await r.json();

}catch{}


if(
  !r.ok
){

throw new Error(
  j.error
  ||
  '通信エラー'
);

}

return j;

}


function msg(
  id,
  text,
  ok=false
){

$(id).innerHTML =
text
?
`<div class="${ok?'ok':'error'}">
${esc(text)}
</div>`
:
'';

}


function monthRange(){

const first =
new Date(
  view.getFullYear(),
  view.getMonth(),
  1
);

const last =
new Date(
  view.getFullYear(),
  view.getMonth()+1,
  0
);

return [
  ymd(first),
  ymd(last)
];

}


function staffName(id){

return (
  staff.find(
    s =>
    Number(s.id)
    ===
    Number(id)
  )?.name
  ||
  '未設定'
);

}


async function login(){

sessionStorage
.setItem(
  'salonAdminPassword',
  $('password').value
);

try{

await call(
  'admin_verify'
);

$('login')
.classList
.add(
  'hidden'
);

$('app')
.classList
.remove(
  'hidden'
);

$('logoutBtn')
.classList
.remove(
  'hidden'
);

await loadMonth();

}catch(e){

sessionStorage
.removeItem(
  'salonAdminPassword'
);

msg(
  'loginMsg',
  e.message
);

}

}


function logout(){

sessionStorage
.removeItem(
  'salonAdminPassword'
);

location.reload();

}


function showTab(id){

[
  'res',
  'blocks',
  'settings'
]
.forEach(
  x =>
  $(x)
  .classList
  .toggle(
    'hidden',
    x !== id
  )
);

if(
  id === 'blocks'
){

loadBlocks();

}

}


async function loadMonth(){

try{

const [
  from,
  to
] =
monthRange();


const j =
await call(
  'admin_bookings',
  {
    from,
    to
  }
);


bookings =
j.data
||
[];


staff =
j.staff
||
[];


renderStaff();

renderCalendar();


if(
  !selected
  ||
  selected < from
  ||
  selected > to
){

selected =
ymd(
  new Date(
    view.getFullYear(),
    view.getMonth(),
    1
  )
);

}


renderDay();

}catch(e){

alert(
  e.message
);

}

}


function moveMonth(n){

view =
new Date(
  view.getFullYear(),
  view.getMonth()+n,
  1
);

selected =
'';

loadMonth();

}


function renderStaff(){

const options =

staff
.filter(
  s =>
  s.active !== false
)
.map(
  s =>
  `<option value="${s.id}">
  ${esc(s.name)}
  </option>`
)
.join('');


$('editStaff')
.innerHTML =
options;


$('blockStaff')
.innerHTML =
'<option value="">サロン全体</option>'
+
options;

}


function renderCalendar(){

const y =
view.getFullYear();

const m =
view.getMonth();


const first =
new Date(
  y,
  m,
  1
);


const start =
new Date(
  y,
  m,
  1-first.getDay()
);


const today =
ymd(
  new Date()
);


$('monthLabel')
.textContent =
`${y}年 ${m+1}月`;


let html =
'';


for(
  let i=0;
  i<42;
  i++
){

const d =
new Date(
  start
);


d.setDate(
  start.getDate()+i
);


const date =
ymd(
  d
);


const arr =

bookings.filter(
  b =>
  b.booking_date === date
  &&
  b.status === 'confirmed'
);


html +=

`<div
class="day
${d.getMonth()===m?'':'other'}
${date===today?'today':''}
${date===selected?'selected':''}"
onclick="selectDay('${date}')"
>

<div class="num">
${d.getDate()}
</div>

${
arr.length
?
`<span class="count">
${arr.length}件
</span>`
:
''
}

</div>`;

}


$('calendar')
.innerHTML =
html;

}


function selectDay(date){

selected =
date;


$('blockDate')
.value =
date;


renderCalendar();

renderDay();

}


function renderDay(){

const arr =

bookings.filter(
  b =>
  b.booking_date === selected
);


$('dayTitle')
.textContent =
`${selected} の予約`;


if(
  !arr.length
){

$('bookingList')
.innerHTML =

'<p class="note">予約はありません。</p>';

return;

}


$('bookingList')
.innerHTML =

arr
.map(
b =>

`<div class="booking ${b.status==='cancelled'?'cancelled':''}">

<b>
${fmt(b.slot_start)}
〜
${fmt(b.slot_end)}
　
${esc(b.customer_name)}
</b>

<br>

<span class="tag">
${esc(staffName(b.staff_id))}
</span>

<span class="tag">
${b.status==='cancelled'?'キャンセル':'予約確定'}
</span>

<p>

${esc(b.phone)}

${
b.email
?
'<br>'
+
esc(b.email)
:
''
}

${
b.memo
?
'<br>メモ：'
+
esc(b.memo)
:
''
}

</p>


<div class="actions">

<button
class="ghost"
onclick="openEdit(${b.id})"
>
編集
</button>


${
b.status==='confirmed'
?
`<button
class="danger"
onclick="cancelBooking(${b.id})"
>
キャンセル
</button>`
:
'<span></span>'
}

</div>

</div>`

)
.join('');

}


function openEdit(id){

const b =

bookings.find(
  x =>
  Number(x.id)
  ===
  Number(id)
);


if(
  !b
){
  return;
}


$('editId')
.value =
b.id;


$('editDate')
.value =
b.booking_date;


$('editSlot')
.value =
b.slot_start;


$('editStaff')
.value =
b.staff_id;


$('editName')
.value =
b.customer_name;


$('editPhone')
.value =
b.phone;


$('editEmail')
.value =
b.email || '';


$('editMemo')
.value =
b.memo || '';


$('editStatus')
.value =
b.status;


msg(
  'editMsg',
  ''
);


$('modal')
.classList
.remove(
  'hidden'
);

}


function closeModal(){

$('modal')
.classList
.add(
  'hidden'
);

}


async function saveEdit(){

try{

await call(
  'admin_update_booking',
  {

    id:
    Number(
      $('editId').value
    ),

    date:
    $('editDate').value,

    slot_start:
    $('editSlot').value,

    staff_id:
    Number(
      $('editStaff').value
    ),

    customer_name:
    $('editName').value,

    phone:
    $('editPhone').value,

    email:
    $('editEmail').value,

    memo:
    $('editMemo').value,

    status:
    $('editStatus').value

  }
);


msg(
  'editMsg',
  '保存しました',
  true
);


await loadMonth();


setTimeout(
  closeModal,
  400
);

}catch(e){

msg(
  'editMsg',
  e.message
);

}

}


async function cancelBooking(id){

if(
  !confirm(
    'この予約をキャンセルにしますか？'
  )
){

return;

}


try{

await call(
  'admin_cancel_booking',
  {
    id
  }
);


await loadMonth();

}catch(e){

alert(
  e.message
);

}

}


function toggleSlot(){

$('slotWrap')
.classList
.toggle(
  'hidden',
  $('blockType').value === 'day'
);

}


async function addBlock(){

try{

const all =
$('blockType').value === 'day';


const parts =
$('blockSlot')
.value
.split('|');


await call(
  'admin_add_block',
  {

    block_date:
    $('blockDate').value,

    staff_id:
    $('blockStaff').value || null,

    all_day:
    all,

    slot_start:
    all
    ?
    null
    :
    parts[0],

    slot_end:
    all
    ?
    null
    :
    parts[1],

    reason:
    $('blockReason').value

  }
);


msg(
  'blockMsg',
  '設定しました',
  true
);


$('blockReason')
.value =
'';


await loadBlocks();

}catch(e){

msg(
  'blockMsg',
  e.message
);

}

}


async function loadBlocks(){

try{

const [
  from,
  to
] =
monthRange();


const j =
await call(
  'admin_blocks',
  {
    from,
    to
  }
);


if(
  j.staff?.length
){

staff =
j.staff;

renderStaff();

}


const list =
j.data
||
[];


$('blockList')
.innerHTML =

list.length
?

list
.map(
x =>

`<div class="block">

<b>
${esc(x.block_date)}

async function removeBlock(id){

if(
  !confirm(
    'この設定を解除しますか？'
  )
){

return;

}


try{

await call(
  'admin_remove_block',
  {
    id
  }
);


await loadBlocks();

}catch(e){

alert(
  e.message
);

}

}


async function changePassword(){

try{

await call(
  'admin_change_password',
  {

    new_password:
    $('newPassword').value

  }
);


sessionStorage
.setItem(
  'salonAdminPassword',
  $('newPassword').value
);


$('newPassword')
.value =
'';


msg(
  'passwordMsg',
  '変更しました',
  true
);

}catch(e){

msg(
  'passwordMsg',
  e.message
);

}

}


$('blockDate')
.value =
ymd(
  new Date()
);


$('blockDate')
.min =
ymd(
  new Date()
);


if(
  pw()
){

call(
  'admin_verify'
)

.then(
  () => {

$('login')
.classList
.add(
  'hidden'
);


$('app')
.classList
.remove(
  'hidden'
);


$('logoutBtn')
.classList
.remove(
  'hidden'
);


loadMonth();

  }
)

.catch(
  () =>

sessionStorage
.removeItem(
  'salonAdminPassword'
)

);

}

</script>
